<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kategori - MoneyKos</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
</head>
<body>
<div class="app">
  <aside class="side" id="sidebar"></aside>
  <main>
    <header class="top">
      <div><h2>Kategori</h2><p class="muted">Kelola kategori pemasukan dan pengeluaran.</p></div>
      <div class="top-r"><div class="right"><b id="tanggal"></b><br><small class="muted">Periode Kos Aktif</small></div><button id="reset" class="btn ghost">↻ Reset Data</button></div>
    </header>
    <div id="toast"></div>
    <section id="view">
      <div class="card">
        <div class="row">
          <h3 id="judulForm">Tambah Kategori</h3>
          <button class="btn sm ghost" type="button" id="btnSeed">Pulihkan kategori bawaan</button>
        </div>
        <form class="f" id="fKat">
          <div><label>Nama</label><input name="nama" required></div>
          <div>
            <label>Tipe</label>
            <select name="tipe">
              <option value="PENGELUARAN">Pengeluaran</option>
              <option value="PEMASUKAN">Pemasukan</option>
            </select>
          </div>
          <div><label>Deskripsi</label><input name="deskripsi"></div>
          <div>
            <button class="btn primary" id="btnSimpan">Tambah</button>
            <button class="btn ghost hidden" type="button" id="btnBatal">Batal</button>
          </div>
        </form>
      </div>

      <div class="card">
        <table>
          <thead><tr><th>Nama</th><th>Tipe</th><th>Deskripsi</th><th></th></tr></thead>
          <tbody id="daftar"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script type="module" src="../js/features/kategori/kategoriPage.js"></script>
</body>
</html>
