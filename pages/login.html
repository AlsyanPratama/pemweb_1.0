<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk - MoneyKos</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="login">
  <form id="loginForm" class="card login-card">
    <img class="logo" src="../img/brand/logo.svg" alt="MoneyKos">
    <h1>Money<span>Kos</span></h1>
    <p class="muted">Pengelola Keuangan Kos</p>
    <label>Nama kamu</label>
    <input id="namaUser" placeholder="mis. asd" required maxlength="20">
    <button class="btn primary" type="submit">Masuk</button>
    <p class="muted small">Data disimpan di browser perangkat ini saja.</p>
  </form>
</div>
<script type="module" src="../js/features/auth/loginPage.js"></script>
</body>
</html>
